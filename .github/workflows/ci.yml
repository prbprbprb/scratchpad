name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 both runs Gradle / the Android Gradle Plugin and is the
      # compilation toolchain (jvmToolchain(21)).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fails the build on any unformatted / non-AOSP code. Kept as its own
      # step so formatting problems surface quickly, before the longer build.
      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest
